  - name: Moods
    description: |-
      Eva mood creation, editing, activation, and membership. The observed
      edit flow is GET home -> locate mood -> PATCH the complete edited mood
      object -> wait for the asynchronous action -> GET home to verify. Use
      POST /activate separately to apply the saved mood.
