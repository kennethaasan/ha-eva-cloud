x-eva-common-headers:
  description: |-
    The current Android client sends these headers on API requests. The home
    API also receives X-Partition-Key, set by the client to the first
    character of the home ID. Header names and values are app-client details,
    not user secrets.
  headers:
    X-Client-ID:
      required: true
      example: Android-2.4.5_499-evaSmartProd
      description: Eva client identifier used by the current Android app.
    X-Client-Brand:
      required: true
      example: eva
      description: Client brand identifier.
    X-Client-Language:
      required: true
      example: nb
      description: BCP-47 language tag selected by the client.
    X-Schema-Version:
      required: true
      example: '7'
      description: Eva API schema version selected by the client.
    X-Partition-Key:
      required: false
      x-required-when: home-scoped
      example: a
      description: For home-scoped calls, the current client uses the first character of homeId.
x-eva-mood-edit-flow:
  status: observed-partial
  description: |-
    Practical sequence for changing an existing mood without committing
    household identifiers to documentation. The exact server-side schema is
    app-version dependent; preserve fields returned by Eva and verify after
    every asynchronous write.
  steps:
    - step: 1
      action: GET /homes/{homeId}
      purpose: Read the current mood and preserve its complete definition.
    - step: 2
      action: PATCH /homes/{homeId}/moods/{moodId}
      purpose: Send the edited name/icon/room/deviceIds/groupIds object as JSON.
    - step: 3
      action: Wait for the 202 action response
      purpose: Record actionId if returned; acceptance is not confirmation of persistence.
    - step: 4
      action: GET /homes/{homeId}
      purpose: Confirm the mood now contains the intended definition.
    - step: 5
      action: POST /homes/{homeId}/moods/{moodId}/activate
      purpose: Apply the saved mood; editing and activation are separate operations.
  cautions:
    - Do not assume a partial PATCH preserves omitted fields across app versions.
    - Do not assume changing a live device attribute changes the value stored by a mood.
    - Use a test mood or test home before changing heating, lighting, or other equipment.
