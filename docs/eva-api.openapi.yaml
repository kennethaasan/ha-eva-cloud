components:
  securitySchemes:
    evaBasicAuth:
      type: http
      scheme: basic
      description: Eva account credentials. Never store real credentials in this repository.
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema:
        type: string
      description: Eva home identifier.
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
      description: Eva device identifier.
    DimmerDeviceId:
      name: dimmer_deviceId
      in: path
      required: true
      schema:
        type: string
      description: Eva dimmer device identifier as named by the app route.
    Attribute:
      name: attribute
      in: path
      required: true
      schema:
        type: string
      description: Eva device attribute name.
    AttributeName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Eva group attribute name.
    AttributeValue:
      name: value
      in: path
      required: true
      allowReserved: true
      schema:
        type: string
      description: Attribute value encoded as a path segment.
    MoodId:
      name: moodId
      in: path
      required: true
      schema:
        type: string
      description: Eva mood identifier.
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
      description: Eva room identifier.
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: Eva group identifier.
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      description: Eva rule identifier.
    BugId:
      name: bugId
      in: path
      required: true
      schema:
        type: string
      description: Eva troubleshooting/bug identifier.
    AccessMinutes:
      name: numberOfMinutesOfAccess
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Requested support access duration in minutes.
    NotificationItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Eva notification setting item identifier.
    AccessId:
      name: accessId
      in: path
      required: true
      schema:
        type: string
      description: Eva door-lock access identifier.
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
      description: Eva username.
    Email:
      name: email
      in: path
      required: true
      allowReserved: true
      schema:
        type: string
        format: email
      description: URL-encoded email address.
  requestBodies:
    GenericObject:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    OptionalGenericObject:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    EditMood:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditMood'
          examples:
            completeMoodEdit:
              summary: Rename a mood while preserving its membership
              value:
                name: Hjemme
                icon: home
                roomId: redacted-room-id
                deviceIds:
                  - redacted-device-id
                groupIds: []
  responses:
    Accepted:
      description: Accepted for asynchronous processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionResponse'
    OkObject:
      description: Successful response; exact shape varies by endpoint and app version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericObject'
    Error:
      description: Eva API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
      description: Placeholder for an endpoint payload whose complete schema is not confirmed.
    ActionResponse:
      type: object
      additionalProperties: true
      properties:
        actionId:
          type: string
          description: Asynchronous action identifier returned by observed write calls.
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        timestamp:
          type: string
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    AuthRequest:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      description: Authentication payload; exact fields are app-version dependent.
    EditMood:
      type: object
      additionalProperties: true
      properties:
        moodId:
          type: string
        name:
          type: string
        icon:
          type: string
        roomId:
          type: string
        deviceIds:
          type: array
          items:
            type: string
        groupIds:
          type: array
          items:
            type: string
      required: [name, deviceIds]
      description: |-
        Observed JSON shape used when the Eva app creates or edits a mood.
        For an update, preserve the fields returned by GET /homes/{homeId}
        rather than sending only the changed property. The path moodId is the
        authoritative identifier; the optional body moodId, when present,
        should match it. deviceIds and groupIds describe membership. This
        schema does not establish a generic field for per-device setpoints or
        dimmer levels; those values remain app-version dependent.
    HomeList:
      type: object
      additionalProperties: true
      properties:
        homes:
          type: array
          items:
            $ref: '#/components/schemas/HomeSummary'
    HomeSummary:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
    Home:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        moods:
          type: array
          items:
            $ref: '#/components/schemas/Mood'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        gateway:
          $ref: '#/components/schemas/GenericObject'
    Room:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    Device:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        displayType:
          type: string
        online:
          type: boolean
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAttribute'
    DeviceAttribute:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: object
            - type: array
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
        minValue:
          type: number
        maxValue:
          type: number
        step:
          type: number
        options:
          type: array
          items: {}
    Group:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        deviceIds:
          type: array
          items:
            type: string
    Mood:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        roomId:
          type: string
        active:
          type: boolean
        deviceIds:
          type: array
          items:
            type: string
        groupIds:
          type: array
          items:
            type: string
    MeasurementResponse:
      type: object
      additionalProperties: true
      description: Measurement response; exact fields and query parameters still need confirmation.
