openapi: 3.1.0
info:
  title: Eva Smart Home API (observed)
  version: 2.4.5-observed
  description: |-
    Community-maintained OpenAPI reference for the undocumented HTTP API used
    by the Eva Smart Home Android application.

    This document was reconstructed from the Eva app package
    no.evasmart.app, version 2.4.5 (version code 499), and the calls used by
    this Home Assistant integration. It is not an official Onics/Eva API
    specification. Routes are observed rather than guaranteed, schemas are
    intentionally partial, and write operations may be asynchronous. Verify
    behavior against a test home before changing the integration.

    To edit an existing mood, first GET the home and locate the mood by its
    id, then PATCH /homes/{homeId}/moods/{moodId} with the edited mood object.
    The safest observed-app-compatible form is a complete object preserving
    the current name, icon, room, deviceIds, and groupIds. Eva normally returns
    202 with an actionId; GET the home again to verify the saved mood. PATCH
    changes the mood definition or membership, while POST /activate applies an
    existing mood. The generic device-attribute route changes a live device;
    this reference does not claim that such a live change also updates the
    values stored in a mood. Per-device mood-value payloads remain unconfirmed.

    Do not put Eva credentials, access tokens, home IDs, device IDs, or other
    household identifiers in this file or in issue reports.
